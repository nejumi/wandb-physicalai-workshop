name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  isaac-uv-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Execute notebook uv install cell without uv on PATH
        run: |
          python -m venv /tmp/isaac-bootstrap-kernel
          /tmp/isaac-bootstrap-kernel/bin/python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          os.environ['PATH'] = '/usr/bin:/bin'
          notebook = json.loads(Path('notebooks/02_isaac_lab_wandb_quickstart.ipynb').read_text())
          source = ''.join(next(c for c in notebook['cells'] if c['id'] == 'install-uv')['source'])
          for attempt in range(2):
              exec(compile(source, '<notebook uv bootstrap>', 'exec'))
              # The shell entry point must work even without the modified PATH.
              env = dict(os.environ, PATH='/usr/bin:/bin')
              subprocess.run(['/bin/bash', '-c', '"$UV_BIN" --version'], env=env, check=True)
          PY
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only deps
        run: |
          pip install --upgrade pip
          pip install numpy pytest gym-pusht
          pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Run tests
        run: pytest -q
